<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Q3Seatwork1</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Edu+AU+VIC+WA+NT+Hand:wght@500&family=Playwrite+AU+SA:wght@100..400&family=Poppins:ital,wght@1,300&display=swap" rel="stylesheet">
	<style>
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #74cf6d;
        }
        h1{
        	font-family: "Edu AU VIC WA NT Hand", serif;
        }
        h3{
        	font-family: Times New Roman, sans-serif;
        }
        .converter{
            text-align: center;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /*convert button shadow*/
        }
        .converter label, 
        .converter select{
            margin-bottom: 10px;
            display: block;
        }
        button{
            margin-top: 10px;
        }
        .edu-au-vic-wa-nt-hand-<uniquifier> {
  		font-family: "Edu AU VIC WA NT Hand", serif;
  		font-optical-sizing: auto;
  		font-weight: 500;
  		font-style: normal;
		}
	</style>
</head>
<body>
	<h1>🤑Currency Converter🤑</h1>
	 <p><b>Convert 100 Pesos to Dollars, Yen, Euro, and Pound</b></p>

    <label for="currency1"><b>First currency:</b></label>
    <select id="currency1">
        <option value="usd">Dollar</option>
        <option value="euro">Euro</option>
    </select>

    <label for="currency2"><b>Second currency:</b></label>
    <select id="currency2">
        <option value="yen">Yen</option>
        <option value="pound">Pound</option>
    </select>

    <br>

    <button onclick="convertCurrencies()">Convert</button>

    <br>

    <h3>Results:</h3>
    <p id="result1"></p>
    <p id="result2"></p>

    <a href="index.html"><button class="btn btn-success btn-lg">Refresh</button></a>

    <script>
        // Conversion rates based on results from Google //
        const conversionRates ={
            usd: 0.017,
            yen: 2.68810,
            euro: 0.0166,
            pound: 0.014,
        };
        function convertCurrencies(){
            const currency1 = document.getElementById('currency1').value;
            const currency2 = document.getElementById('currency2').value;

            const amountInPesos = 100;

            const result1 = amountInPesos * conversionRates[currency1];
            const result2 = amountInPesos * conversionRates[currency2];

            document.getElementById('result1').textContent = `₱100 in ${currency1.toUpperCase()} is ${result1.toFixed(2)}`;
            document.getElementById('result2').textContent = `₱100 in ${currency2.toUpperCase()} is ${result2.toFixed(2)}`;
        }
    </script>
</body>
</html>
